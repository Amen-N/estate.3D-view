version: '3.9'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: realestate_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secret_123}
      POSTGRES_DB: ${POSTGRES_DB:-realestate_engine}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_admin} -d ${POSTGRES_DB:-realestate_engine}"]
      interval: 4s
      timeout: 4s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: realestate_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 4s
      timeout: 4s
      retries: 5

volumes:
  pg_data:
